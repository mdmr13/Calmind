<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mi sitio Django{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; color:#20283a; }
    .navbar { background:#18243b; }
    .navbar-brand, .nav-link { color:#fff !important; }
    .hero { background:linear-gradient(135deg,#253b68,#5676b9); color:white; border-radius:24px; }
    .soft-card { border:0; border-radius:18px; box-shadow:0 10px 30px rgba(27,43,74,.08); }
    .btn-primary { background:#4569ad; border-color:#4569ad; }
    .muted { color:#68758b; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">Mi sitio Django</a>
    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{% url 'inicio' %}">Inicio</a>
        <a class="nav-link" href="{% url 'login' %}">Iniciar sesión</a>
        <a class="nav-link" href="{% url 'panel' %}">Panel</a>
      </div>
    </div>
  </div>
</nav>
<main class="container py-5">
  {% block content %}{% endblock %}
</main>
<footer class="text-center py-4 muted small">Actividad: Mi primera aplicación web con Django</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
